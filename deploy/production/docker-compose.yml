services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-caredesk}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - wacs-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-caredesk}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - wacs-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  waha:
    image: devlikeapro/waha:latest
    restart: unless-stopped
    ports:
      - "${WAHA_PORT}:3000"
    environment:
      - WAHA_BASE_URL=${WAHA_PUBLIC_URL}
      - WAHA_API_KEY=${WAHA_API_KEY}
      - WAHA_DASHBOARD_USERNAME=${WAHA_DASHBOARD_USERNAME}
      - WAHA_DASHBOARD_PASSWORD=${WAHA_DASHBOARD_PASSWORD}
      - WHATSAPP_SWAGGER_USERNAME=${WHATSAPP_SWAGGER_USERNAME}
      - WHATSAPP_SWAGGER_PASSWORD=${WHATSAPP_SWAGGER_PASSWORD}
      - WHATSAPP_HOOK_URL=${WHATSAPP_HOOK_URL}/${WAHA_WEBHOOK_TOKEN}
      - WHATSAPP_HOOK_EVENTS=message
      - WHATSAPP_HOOK_HMAC_KEY=${WAHA_WEBHOOK_HMAC_KEY}
      - WHATSAPP_HOOK_RETRIES_POLICY=linear
      - WHATSAPP_HOOK_RETRIES_DELAY_SECONDS=2
      - WHATSAPP_HOOK_RETRIES_ATTEMPTS=4
      - WHATSAPP_DOWNLOAD_MEDIA=true
      - WHATSAPP_FILES_FOLDER=/app/.media
      - WHATSAPP_FILES_LIFETIME=0
      - WHATSAPP_START_SESSION=${WAHA_NOTIFICATION_SESSION}
      - WHATSAPP_RESTART_ALL_SESSIONS=True
      - WAHA_SESSION_CONFIG_IGNORE_STATUS=true
      - WAHA_SESSION_CONFIG_IGNORE_CHANNELS=true
      - WAHA_SESSION_CONFIG_IGNORE_BROADCAST=true
      - WAHA_SESSION_CONFIG_IGNORE_GROUPS=false
    volumes:
      - waha_sessions:/app/.sessions
      - waha_media:/app/.media
    networks:
      - wacs-net

  app:
    build:
      context: ../../src
      dockerfile: Dockerfile
    image: wacs-production-app:latest
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - DB_CONNECTION=sqlsrv
      - DB_HOST=sqlserver
      - DB_PORT=1433
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=sa
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_ENCRYPT=${DB_ENCRYPT}
      - DB_TRUST_SERVER_CERTIFICATE=${DB_TRUST_SERVER_CERTIFICATE}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - CACHE_STORE=redis
      - QUEUE_CONNECTION=redis
      - SESSION_DRIVER=redis
      - REVERB_SCALING_ENABLED=true
      - WAHA_BASE_URL=${WACS_WAHA_BASE_URL}
      - WAHA_MEDIA_BASE_URL=${WACS_WAHA_MEDIA_BASE_URL}
      - WAHA_API_KEY=${WAHA_API_KEY}
      - WAHA_WEBHOOK_TOKEN=${WAHA_WEBHOOK_TOKEN}
      - WAHA_WEBHOOK_HMAC_KEY=${WAHA_WEBHOOK_HMAC_KEY}
      - WAHA_SEND_TEXT_PATH=/api/sendText
      - WAHA_NOTIFICATION_SESSION=${WAHA_NOTIFICATION_SESSION}
    volumes:
      - ../../src:/var/www/html
      - wacs_storage:/var/www/html/storage
    networks:
      - wacs-net
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT}:80"
    volumes:
      - ../../src:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - wacs-net
    depends_on:
      - app

  queue-webhooks:
    image: wacs-production-app:latest
    restart: unless-stopped
    env_file:
      - .env.production
    command: php artisan queue:work --queue=webhooks --tries=3 --timeout=60 --sleep=1
    environment:
      - DB_CONNECTION=sqlsrv
      - DB_HOST=sqlserver
      - DB_PORT=1433
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=sa
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_ENCRYPT=${DB_ENCRYPT}
      - DB_TRUST_SERVER_CERTIFICATE=${DB_TRUST_SERVER_CERTIFICATE}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - CACHE_STORE=redis
      - QUEUE_CONNECTION=redis
      - SESSION_DRIVER=redis
      - REVERB_SCALING_ENABLED=true
    volumes:
      - ../../src:/var/www/html
      - wacs_storage:/var/www/html/storage
    networks:
      - wacs-net
    depends_on:
      - app

  queue-ai:
    image: wacs-production-app:latest
    restart: unless-stopped
    env_file:
      - .env.production
    command: php artisan queue:work --queue=ai-replies --tries=2 --timeout=90 --sleep=1
    environment:
      - DB_CONNECTION=sqlsrv
      - DB_HOST=sqlserver
      - DB_PORT=1433
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=sa
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_ENCRYPT=${DB_ENCRYPT}
      - DB_TRUST_SERVER_CERTIFICATE=${DB_TRUST_SERVER_CERTIFICATE}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - CACHE_STORE=redis
      - QUEUE_CONNECTION=redis
      - SESSION_DRIVER=redis
      - REVERB_SCALING_ENABLED=true
    volumes:
      - ../../src:/var/www/html
      - wacs_storage:/var/www/html/storage
    networks:
      - wacs-net
    depends_on:
      - app

  queue-broadcasts:
    image: wacs-production-app:latest
    restart: unless-stopped
    env_file:
      - .env.production
    command: php artisan queue:work --queue=broadcasts,default --tries=3 --timeout=30 --sleep=1
    environment:
      - DB_CONNECTION=sqlsrv
      - DB_HOST=sqlserver
      - DB_PORT=1433
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=sa
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_ENCRYPT=${DB_ENCRYPT}
      - DB_TRUST_SERVER_CERTIFICATE=${DB_TRUST_SERVER_CERTIFICATE}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - CACHE_STORE=redis
      - QUEUE_CONNECTION=redis
      - SESSION_DRIVER=redis
      - REVERB_SCALING_ENABLED=true
    volumes:
      - ../../src:/var/www/html
      - wacs_storage:/var/www/html/storage
    networks:
      - wacs-net
    depends_on:
      - app

  scheduler:
    image: wacs-production-app:latest
    restart: unless-stopped
    env_file:
      - .env.production
    command: php artisan schedule:work
    environment:
      - DB_CONNECTION=sqlsrv
      - DB_HOST=sqlserver
      - DB_PORT=1433
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=sa
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_ENCRYPT=${DB_ENCRYPT}
      - DB_TRUST_SERVER_CERTIFICATE=${DB_TRUST_SERVER_CERTIFICATE}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - CACHE_STORE=redis
      - QUEUE_CONNECTION=redis
      - SESSION_DRIVER=redis
      - REVERB_SCALING_ENABLED=true
    volumes:
      - ../../src:/var/www/html
      - wacs_storage:/var/www/html/storage
    networks:
      - wacs-net
    depends_on:
      - app

  reverb:
    image: wacs-production-app:latest
    restart: unless-stopped
    env_file:
      - .env.production
    command: php artisan reverb:start --host=0.0.0.0 --port=7060
    ports:
      - "${REVERB_PORT}:7060"
    environment:
      - DB_CONNECTION=sqlsrv
      - DB_HOST=sqlserver
      - DB_PORT=1433
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=sa
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_ENCRYPT=${DB_ENCRYPT}
      - DB_TRUST_SERVER_CERTIFICATE=${DB_TRUST_SERVER_CERTIFICATE}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - CACHE_STORE=redis
      - QUEUE_CONNECTION=redis
      - SESSION_DRIVER=redis
      - REVERB_SCALING_ENABLED=true
    volumes:
      - ../../src:/var/www/html
      - wacs_storage:/var/www/html/storage
    networks:
      - wacs-net
    depends_on:
      - app

  setup:
    image: wacs-production-app:latest
    build:
      context: ../../src
      dockerfile: Dockerfile
    profiles:
      - setup
    env_file:
      - .env.production
    command: >
      bash -c "composer install --no-dev --optimize-autoloader && npm install --ignore-scripts && npm run build"
    volumes:
      - ../../src:/var/www/html
    networks:
      - wacs-net
    depends_on:
      - app

networks:
  wacs-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  waha_sessions:
  waha_media:
  wacs_storage:
